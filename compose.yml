# Runs on the Oracle VM next to the other sites. The shared Caddy (network deploy_default)
# does HTTPS and proxies poker.sawyerpham.dev -> poker:8000.
#   docker compose up -d --build   (CI does this on every push to main: see deploy/cd.sh)
services:
  poker:
    build: .
    restart: unless-stopped
    # Sign-in keys (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, RESEND_API_KEY): kept outside this folder so a
    # redeploy that replaces the folder keeps them. Without it the site runs with sign-in hidden.
    env_file:
      - path: ../poker.env
        required: false
    volumes:
      - data:/data
    # `docker compose up --wait` (deploy/cd.sh) waits for this before calling a deploy done.
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    networks: [deploy_default]

volumes:
  data:

networks:
  deploy_default:
    external: true
