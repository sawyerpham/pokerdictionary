# Native command-line build of the same solver, for computing the flop libraries on a desktop (all cores, no 4 GB
# browser limit). Licensed AGPL-3.0-or-later like the solver. Build: sh solver/native/build.sh
[package]
name = "flopsolve"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
