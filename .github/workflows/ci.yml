name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt httpx
      - run: python backend/check.py

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pokerdictionary .

  deploy:
    name: Deploy to poker.sawyerpham.dev
    needs: [check, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}   # until the secret is added, the job passes without deploying
    steps:
      - name: Redeploy over SSH
        if: env.HAS_KEY == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # the server's host key, pinned so the runner never trusts a different machine
          HOST_KEY: poker.sawyerpham.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINO1atayZVp0RD1wNtmPMPfxzmrvBpzoHttd5C3Igycw
        run: |
          install -d -m 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$HOST_KEY" > ~/.ssh/known_hosts
          # the key's forced command (deploy/cd.sh) pulls main, rebuilds and waits for the app to be healthy
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes ubuntu@poker.sawyerpham.dev
      - name: Check the site answers
        if: env.HAS_KEY == 'true'
        run: curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors https://poker.sawyerpham.dev/api/health
